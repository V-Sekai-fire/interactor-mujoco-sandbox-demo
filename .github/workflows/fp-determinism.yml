name: fp-determinism

# The physics guest is RISC-V, emulated by libriscv, so the same stepping must
# produce a bit-identical state digest on every host regardless of OS or CPU.
# This runs the committed guest through the real sandbox host on x86_64 and
# arm64 and fails if the digests differ. arm64 vs x86_64 is the test that
# matters: different FP hardware, and the platforms we ship to (desktop and
# Steam Deck are x86_64, Quest is arm64).

on:
  push:
    paths:
      - "project/**"
      - "tools/determinism/**"
      - "tools/inverse/**"
      - "tools/elf/**"
      - "tools/human/**"
      - "patches/**"
      - "third_party/**"
      - ".github/workflows/fp-determinism.yml"
  pull_request:
    paths:
      - "project/**"
      - "tools/determinism/**"
      - "tools/inverse/**"
      - "tools/elf/**"
      - "tools/human/**"
      - "patches/**"
      - "third_party/**"
      - ".github/workflows/fp-determinism.yml"
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2-stable"
  FORK: "https://github.com/V-Sekai-fire/godot-sandbox"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Each committed guest carries the Variant size its engine loads: 24 for single precision, 40 for
  # double. An engine of the other precision refuses the guest, so a wrong marker is a guest that
  # never runs.
  variant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"
      - name: Variant size of the committed guests, and its planted control
        run: |
          set -e
          PAIRS="project/plans/mujoco.elf=24 project/plans/mujoco.double.elf=40"
          elixir tools/elf/check_variant.exs $PAIRS
          if elixir tools/elf/check_variant.exs --plant $PAIRS; then
            echo "FAIL: the check passed with the markers planted at the other size"
            exit 1
          fi

  digest:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,     arch: x86_64, build: true }
          - { os: ubuntu-24.04-arm,  arch: arm64,  build: true }
          - { os: windows-latest,    arch: x86_64, build: false }  # reuse the committed DLL
          - { os: macos-latest,      arch: arm64,  build: true }   # the committed framework holds no binary
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # --- Build the extension natively (Linux and macOS legs) ---
      - name: Install build tools (Linux)
        if: matrix.build && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build clang

      - name: Install build tools (macOS)
        if: matrix.build && runner.os == 'macOS'
        run: brew install ninja

      - name: Build the sandbox extension from the fork
        if: matrix.build
        run: |
          set -e
          git clone --recursive --depth 1 "$FORK" gs
          # Apply the vendored-dependency patches (paging/FP fix, includes, stdlib).
          git -C gs/ext/libriscv apply "$GITHUB_WORKSPACE/patches/libriscv-paging-and-includes.patch"
          git -C gs/ext/godot-cpp apply "$GITHUB_WORKSPACE/patches/godot-cpp-stdlib-include.patch"
          cmake -S gs -B gs/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DENABLE_SAFEGDSCRIPT=OFF -DRISCV_BINARY_TRANSLATION=OFF
          cmake --build gs/build -j --target godot-riscv
          BIN=project/addons/godot_sandbox/bin
          if [ "$RUNNER_OS" = "macOS" ]; then
            # The framework is committed without its binary; the name comes from its Info.plist.
            SO=$(find gs/build -name 'libgodot-riscv*.dylib' -o -name 'libgodot_riscv*.dylib' | head -1)
            test -n "$SO"
            cp "$SO" "$BIN/libgodot_riscv.macos.template_release.universal.framework/libgodot_riscv.macos.template_release.universal"
            echo "installed $SO -> macos ${{ matrix.arch }}"
          else
            SO=$(find gs/build -name 'libgodot-riscv*.so' -o -name 'libgodot_riscv*.so' | head -1)
            test -n "$SO"
            cp "$SO" "$BIN/libgodot_riscv.linux.template_release.${{ matrix.arch }}.so"
            echo "installed $SO -> linux ${{ matrix.arch }}"
          fi

      # --- Godot ---
      - name: Get Godot (Linux)
        if: runner.os == 'Linux'
        run: |
          set -e
          case "${{ matrix.arch }}" in
            x86_64) A=linux.x86_64 ;;
            arm64)  A=linux.arm64  ;;
          esac
          URL="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_${A}.zip"
          curl -fL "$URL" -o godot.zip
          unzip -o godot.zip
          mv Godot_v${GODOT_VERSION}_${A} godot
          chmod +x godot

      - name: Get Godot (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -e
          URL="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_win64.exe.zip"
          curl -fL "$URL" -o godot.zip
          unzip -o godot.zip
          mv Godot_v${GODOT_VERSION}_win64.exe godot.exe

      - name: Get Godot (macOS)
        if: runner.os == 'macOS'
        run: |
          set -e
          URL="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_macos.universal.zip"
          curl -fL "$URL" -o godot.zip
          unzip -q -o godot.zip
          ln -s "$GITHUB_WORKSPACE/Godot.app/Contents/MacOS/Godot" godot

      # --- Import once (registers classes), then run the digest ---
      - name: Compute digest
        shell: bash
        run: |
          set -e
          GODOT="$GITHUB_WORKSPACE/godot"; [ -f "$GITHUB_WORKSPACE/godot.exe" ] && GODOT="$GITHUB_WORKSPACE/godot.exe"
          cd project
          # Import once so the extension's classes register, then run the digest.
          # -s resolves relative to the CWD, so it must be run from project/.
          "$GODOT" --headless --path . --import 2>&1 | tail -3 || true
          # The output is printed whether or not the engine fails, so a failure can be read.
          OUT=$("$GODOT" --headless --path . -s ../tools/determinism/digest.gd 2>&1) || true
          echo "$OUT"
          LINE=$(echo "$OUT" | grep -o 'DIGEST=[0-9-]* STEPS=[0-9]* NQ=[0-9]*' | head -1)
          test -n "$LINE"
          echo "$LINE" > "$GITHUB_WORKSPACE/digest-${{ matrix.os }}-${{ matrix.arch }}.txt"

      - name: Inverse dynamics gate and its planted control
        shell: bash
        run: |
          set -e
          GODOT="$GITHUB_WORKSPACE/godot"; [ -f "$GITHUB_WORKSPACE/godot.exe" ] && GODOT="$GITHUB_WORKSPACE/godot.exe"
          cd project
          "$GODOT" --headless --path . -s ../tools/inverse/inverse_check.gd -- plans/mujoco.elf
          if "$GODOT" --headless --path . -s ../tools/inverse/inverse_check.gd -- plans/mujoco.elf --plant-held; then
            echo "FAIL: the gate passed with the held torque planted"
            exit 1
          fi

      - name: MS-Human-700 model gate and its two controls
        shell: bash
        run: |
          set -e
          GODOT="$GITHUB_WORKSPACE/godot"; [ -f "$GITHUB_WORKSPACE/godot.exe" ] && GODOT="$GITHUB_WORKSPACE/godot.exe"
          cd project
          gate() { "$GODOT" --headless --path . -s ../tools/human/human_check.gd -- plans/mujoco.elf "$@" 2>&1 | tee human.log; grep -q "^RESULT: PASS" human.log; }
          gate
          if gate --withhold-rib; then
            echo "FAIL: the gate passed with a rib mesh withheld"
            exit 1
          fi
          if gate --plant-held; then
            echo "FAIL: the gate passed with the held torque planted"
            exit 1
          fi

      - name: Tendon path and geom table gate and its two controls
        shell: bash
        run: |
          set -e
          GODOT="$GITHUB_WORKSPACE/godot"; [ -f "$GITHUB_WORKSPACE/godot.exe" ] && GODOT="$GITHUB_WORKSPACE/godot.exe"
          cd project
          gate() { "$GODOT" --headless --path . -s ../tools/human/tendon_check.gd -- plans/mujoco.elf "$@" 2>&1 | tee tendon.log; grep -q "^RESULT: PASS" tendon.log; }
          gate
          if gate --plant-swap; then
            echo "FAIL: the gate passed with two tendons' points swapped"
            exit 1
          fi
          if gate --plant-geom; then
            echo "FAIL: the gate passed with a geom on a body the model does not have"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.os }}-${{ matrix.arch }}
          path: digest-*.txt

  compare:
    needs: digest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: digests, merge-multiple: true }
      # Four hosts, so that one host that differs is outvoted by three and can be named. With
      # three hosts and one wrong, a second fault could not be told from the first.
      - name: Four hosts must agree
        run: |
          set -e
          # agree <dir>: 0 when the directory holds exactly four digests and they are one value.
          agree() {
            local dir="$1" count distinct major f
            count=$(ls "$dir"/digest-*.txt | wc -l)
            if [ "$count" -ne 4 ]; then
              echo "FAIL: $count digest files, and four hosts are required"
              return 1
            fi
            distinct=$(sort -u "$dir"/digest-*.txt | wc -l)
            if [ "$distinct" -eq 1 ]; then
              return 0
            fi
            major=$(sort "$dir"/digest-*.txt | uniq -c | sort -rn | head -1 | sed 's/^ *[0-9]* //')
            for f in "$dir"/digest-*.txt; do
              [ "$(cat "$f")" = "$major" ] || echo "ODD: $(basename "$f" .txt) reports $(cat "$f")"
            done
            echo "FAIL: the guest is not deterministic across hosts ($distinct distinct digests)"
            return 1
          }
          echo "=== per-host digests ==="
          for f in digests/digest-*.txt; do echo "$(basename "$f" .txt): $(cat "$f")"; done
          agree digests

          # Control: one host's digest altered in a copy must fail, and that host must be named.
          cp -r digests plant
          odd=$(ls plant/digest-*.txt | head -1)
          echo "DIGEST=0 STEPS=0 NQ=0" > "$odd"
          if agree plant > plant.log; then
            echo "FAIL: the comparison passed with one host's digest altered"
            exit 1
          fi
          grep -q "^ODD: $(basename "$odd" .txt) " plant.log || { echo "FAIL: the altered host was not named"; cat plant.log; exit 1; }

          # Control: three hosts in agreement are not enough.
          cp -r digests three
          rm "$(ls three/digest-*.txt | head -1)"
          if agree three > three.log; then
            echo "FAIL: the comparison passed with three hosts"
            exit 1
          fi
          echo "PASS: identical physics digest on four hosts; both controls fail"
